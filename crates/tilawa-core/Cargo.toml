[package]
name = "tilawa-core"
version = "0.1.0"
edition = "2024"
description = "Tilawa reading-plan logic: the 29 days, page counts, and progress rules"
license = "MIT"
publish = false

[lib]
# cdylib = the .wasm the browser loads, rlib = so `cargo test` can use it as a normal Rust library
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the wasm-bindgen CLI installed on this machine (pacman: wasm-bindgen 0.2.128);
# the crate and the CLI must be the exact same version.
wasm-bindgen = "=0.2.128"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false   # skip downloading binaryen; the release profile already optimises for size
