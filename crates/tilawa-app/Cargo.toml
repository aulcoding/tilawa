[package]
name = "tilawa-app"
version = "0.1.0"
edition = "2024"
description = "Tilawa UI in Rust + Leptos (phase 4: the whole page)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tilawa-core = { path = "../tilawa-core" }
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcodegen = "1.8"
# Must match the wasm-bindgen CLI on this machine exactly (pacman: wasm-bindgen 0.2.128)
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Animation", "Clipboard", "console", "CssStyleDeclaration", "DomRect", "DomTokenList", "Document",
    "Element", "Event", "EventTarget", "FocusOptions", "FontFaceSet", "HtmlButtonElement", "HtmlDocument",
    "HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MediaQueryList", "Navigator",
    "NodeList", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollToOptions",
    "Storage", "Window",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
