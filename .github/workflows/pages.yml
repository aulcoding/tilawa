# Builds the site with trunk (Rust → WebAssembly + wasm-opt, Tailwind) and deploys it to
# GitHub Pages on every push to main. Repo settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older build that hasn't finished
concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.22.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Test the Rust code
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tailwind
        run: npm ci

      - name: Install trunk
        run: |
          f=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o "$f" "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$f"
          curl -fsSL -o "$f.sha256" "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$f.sha256"
          echo "$(cut -d" " -f1 "$f.sha256")  $f" | sha256sum -c   # the .sha256 file holds just the hash
          tar -xzf "$f" -C /usr/local/bin trunk

      # trunk downloads the matching wasm-bindgen CLI and wasm-opt (binaryen) itself
      - name: Build
        run: trunk build --release --public-url /tilawa/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
