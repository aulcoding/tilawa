<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilawa · 29 days to khatam</title>
<meta name="description" content="A 29-day Qur’an reading plan, split by surah, for chronically stressed humans. No account. No ads. No excuses.">
<meta property="og:title" content="Tilawa">
<meta property="og:description" content="You’re not too busy. You’re just busy with the wrong things. A 29-day Qur’an reading plan, split by surah.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<!-- Compiled from styles/app.css by Tailwind (npm run build:css) -->
<link rel="stylesheet" href="styles/build.css">
<!-- Runs before the page paints: carries old "chillawah-*" saves over, applies the saved theme (no flash) -->
<script src="js/boot.js"></script>
</head>
<body>
<a id="skip" class="absolute -top-[60px] left-3 z-50 rounded-[10px] bg-btn px-3.5 py-2.5 text-btn-fg focus:top-3" href="#schedule" data-i18n="skip"></a>

<!-- ───────────── Nav ───────────── -->
<header class="sticky top-0 z-20 border-b border-line bg-nav pt-[env(safe-area-inset-top,0px)] backdrop-blur-[14px] backdrop-saturate-[1.4]">
  <div class="wrap flex h-16 items-center justify-between gap-6 max-md:gap-3">
    <a class="inline-flex items-center gap-2.5 text-[18px] font-medium tracking-snug" href="#top">
      <svg class="size-5" viewBox="0 0 40 40" aria-hidden="true"><circle class="fill-moon-dark stroke-line-strong" cx="20" cy="20" r="18"/><path class="fill-moon-lit" d="M20 2A18 18 0 0 1 20 38A9.6 18 0 0 0 20 2Z"/></svg>
      <span class="max-xs:hidden">Tilawa</span>
    </a>
    <nav class="flex items-center gap-7 text-[15px] max-md:gap-2.5" aria-label="Main">
      <a class="text-muted transition-colors duration-200 hover:text-fg max-md:hidden" href="#schedule" data-i18n="navSchedule"></a>
      <a class="text-muted transition-colors duration-200 hover:text-fg max-md:hidden" href="#excuses" data-i18n="navExcuses"></a>
      <a class="text-muted transition-colors duration-200 hover:text-fg max-md:hidden" href="#support" data-i18n="navSupport"></a>

      <button class="lang relative isolate inline-flex h-[38px] items-stretch gap-0.5 rounded-full border border-line-strong p-[3px] text-[13px] leading-none font-medium tracking-[.04em] text-muted transition-colors duration-200 hover:border-fg"
              id="lang" type="button" data-lang="en" aria-label="Ganti ke Bahasa Indonesia">
        <span class="l-en" aria-hidden="true">EN</span><span class="l-id" aria-hidden="true">ID</span>
      </button>

      <button class="theme relative grid size-[38px] flex-none place-items-center rounded-full border border-line-strong text-fg transition-colors duration-200 hover:border-fg" id="theme" type="button">
        <svg class="ic-moon col-start-1 row-start-1 size-[18px] fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ic-sun col-start-1 row-start-1 size-[18px] fill-none stroke-current stroke-[1.8] [stroke-linecap:round]" viewBox="0 0 24 24" aria-hidden="true"><circle class="fill-current stroke-none" cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>

      <a class="btn btn-primary btn-sm" id="nav-start" href="#schedule" data-jump="1" data-i18n="navStart"></a>
    </nav>
  </div>
</header>

<main id="top">
  <!-- ───────────── Hero ───────────── -->
  <section class="relative flex min-h-[calc(100svh-64px)] items-center overflow-hidden pt-[clamp(56px,8vh,96px)] pb-[clamp(72px,10vh,112px)] max-2xl:block max-2xl:min-h-0 max-2xl:pt-8 max-2xl:pb-[72px]">
    <div class="wrap relative z-1 grid w-full grid-cols-[minmax(0,1fr)_minmax(220px,420px)] items-center gap-[clamp(40px,6vw,96px)] max-2xl:grid-cols-1 max-2xl:gap-[72px]">
      <div class="hero-copy min-w-0">
        <p class="mb-[22px] text-[16px] text-muted" data-i18n="kicker"></p>
        <h1 class="text-hero font-light tracking-display text-balance [&_span]:block" data-i18n="h1"></h1>
        <p class="mt-8 mb-9 max-w-[52ch] text-sub text-muted" data-i18n="heroSub"></p>
        <div class="flex flex-wrap gap-3">
          <a class="btn btn-primary" href="#plan" data-i18n="ctaPlan"></a>
          <button class="btn btn-ghost btn-roast" id="later" type="button">
            <span class="lbl lbl-a" data-i18n="laterA"></span>
            <span class="lbl lbl-b" aria-hidden="true" data-i18n="laterB"></span>
          </button>
          <span class="sr-only" aria-live="polite" id="later-live"></span>
        </div>
      </div>

      <div class="hero-moon pointer-events-none relative aspect-square w-full max-w-full justify-self-end max-2xl:order-first max-2xl:w-[min(58vw,300px)] max-2xl:justify-self-center">
        <div class="moon-glide absolute inset-0">
          <div class="glow absolute -inset-[16%] rounded-full bg-[radial-gradient(closest-side,var(--glow),transparent_72%)]" aria-hidden="true"></div>
          <svg class="relative block size-full origin-center" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="fill-moon-dark" cx="100" cy="100" r="90"/>
            <path class="lit fill-moon-lit transition-opacity duration-400" id="hero-lit" d=""/>
          </svg>
          <button class="moon-tap pointer-events-auto absolute inset-[5%] rounded-full [-webkit-tap-highlight-color:transparent] focus-visible:rounded-full focus-visible:outline-offset-4" id="moon-tap" type="button"></button>
        </div>
        <div class="breath pointer-events-none absolute top-1/2 left-1/2 -translate-1/2 text-[13px] tracking-label whitespace-nowrap text-muted uppercase opacity-0 transition-opacity duration-900 [&.show]:opacity-100"
             id="breath" data-phase="in" aria-hidden="true"><span data-i18n="breathIn"></span><span data-i18n="breathOut"></span></div>
      </div>
    </div>
  </section>

  <!-- ───────────── Accordion: stats, screen time, plan ───────────── -->
  <div class="relative z-2 flex h-0 justify-center border-t border-line">
    <button class="group absolute top-0 grid size-10 -translate-y-1/2 place-items-center rounded-full border border-line-strong bg-bg text-muted transition-colors duration-200 hover:border-fg hover:text-fg"
            id="more-toggle" type="button" aria-expanded="false" aria-controls="more">
      <svg class="size-[18px] fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round] transition-transform duration-350 group-aria-expanded:rotate-180 motion-reduce:transition-none" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div class="more peer grid grid-rows-[0fr] transition-[grid-template-rows] duration-500 motion-reduce:transition-none [&.open]:grid-rows-[1fr]" id="more">
    <div class="more-inner min-h-0 overflow-hidden" inert>
      <div class="border-b border-line">
        <div class="wrap">
          <p class="py-[clamp(48px,8vw,96px)] text-stats font-light tracking-stats [&_span]:inline-block max-md:[&_span]:block" data-i18n="stats"></p>
        </div>
      </div>

      <section class="section-y" id="reality">
        <div class="wrap">
          <div class="grid grid-cols-[minmax(0,5fr)_minmax(0,7fr)] items-start gap-[clamp(24px,5vw,80px)] max-xl:grid-cols-1">
            <h2 class="max-w-[16ch] text-h2 font-light tracking-title" data-i18n="realityH"></h2>
            <p class="max-w-[46ch] text-big tracking-[-.01em]" data-i18n="realityP"></p>
          </div>
          <figure class="mt-[clamp(64px,9vw,120px)] border-t border-line pt-[clamp(40px,6vw,64px)]">
            <blockquote><p class="max-w-[22ch] font-serif text-ayah font-light tracking-[-.015em] italic" data-i18n="ayah"></p></blockquote>
            <figcaption class="mt-6 flex flex-wrap gap-x-6 gap-y-1.5 text-[15px] text-muted">
              <span>QS Ar-Ra’d 13:28</span>
              <span class="[&_a]:text-fg [&_a]:underline [&_a]:underline-offset-3" data-i18n="ayahNote"></span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="section-y border-t border-line" id="plan">
        <div class="wrap">
          <h2 class="max-w-[16ch] text-h2 font-light tracking-title" data-i18n="planH"></h2>
          <p class="mt-6 max-w-[56ch] text-lede text-muted" data-i18n="planLede"></p>
          <!-- Rules as 4 cards: number, icon, one-line title, short note, key number -->
          <div class="mt-[clamp(40px,6vw,72px)] grid grid-cols-4 gap-3 max-xl:grid-cols-2 max-md:grid-cols-1">
            <article class="flex flex-col gap-4 rounded-card border border-line bg-surface p-6 transition-colors duration-200 hover:border-line-strong">
              <div class="flex items-center justify-between">
                <span class="font-mono text-[13px] tracking-[.08em] text-muted">01</span>
                <span class="grid size-11 place-items-center rounded-full border border-line-strong text-fg">
                  <!-- swords (Lucide) -->
                  <svg class="size-[22px] fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/></svg>
                </span>
              </div>
              <h3 class="text-[21px] leading-[1.25] font-normal tracking-snug" data-i18n="r1h"></h3>
              <p class="text-[15px] leading-[1.55] text-muted" data-i18n="r1p"></p>
              <span class="mt-auto self-start rounded-full border border-line-strong px-2.5 py-1 text-[12.5px] tabular-nums" data-i18n="r1s"></span>
            </article>
            <article class="flex flex-col gap-4 rounded-card border border-line bg-surface p-6 transition-colors duration-200 hover:border-line-strong">
              <div class="flex items-center justify-between">
                <span class="font-mono text-[13px] tracking-[.08em] text-muted">02</span>
                <span class="grid size-11 place-items-center rounded-full border border-line-strong text-fg">
                  <!-- link-2 (Lucide) -->
                  <svg class="size-[22px] fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
                </span>
              </div>
              <h3 class="text-[21px] leading-[1.25] font-normal tracking-snug" data-i18n="r2h"></h3>
              <p class="text-[15px] leading-[1.55] text-muted" data-i18n="r2p"></p>
              <span class="mt-auto self-start rounded-full border border-line-strong px-2.5 py-1 text-[12.5px] tabular-nums" data-i18n="r2s"></span>
            </article>
            <article class="flex flex-col gap-4 rounded-card border border-line bg-surface p-6 transition-colors duration-200 hover:border-line-strong">
              <div class="flex items-center justify-between">
                <span class="font-mono text-[13px] tracking-[.08em] text-muted">03</span>
                <span class="grid size-11 place-items-center rounded-full border border-line-strong text-fg">
                  <!-- full moon -->
                  <svg class="size-[22px] fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><circle class="fill-current stroke-none" cx="12" cy="12" r="9"/></svg>
                </span>
              </div>
              <h3 class="text-[21px] leading-[1.25] font-normal tracking-snug" data-i18n="r3h"></h3>
              <p class="text-[15px] leading-[1.55] text-muted" data-i18n="r3p"></p>
              <span class="mt-auto self-start rounded-full border border-line-strong px-2.5 py-1 text-[12.5px] tabular-nums" data-i18n="r3s"></span>
            </article>
            <article class="flex flex-col gap-4 rounded-card border border-line bg-surface p-6 transition-colors duration-200 hover:border-line-strong">
              <div class="flex items-center justify-between">
                <span class="font-mono text-[13px] tracking-[.08em] text-muted">04</span>
                <span class="grid size-11 place-items-center rounded-full border border-line-strong text-fg">
                  <!-- trending-down (Lucide) -->
                  <svg class="size-[22px] fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/></svg>
                </span>
              </div>
              <h3 class="text-[21px] leading-[1.25] font-normal tracking-snug" data-i18n="r4h"></h3>
              <p class="text-[15px] leading-[1.55] text-muted" data-i18n="r4p"></p>
              <span class="mt-auto self-start rounded-full border border-line-strong px-2.5 py-1 text-[12.5px] tabular-nums" data-i18n="r4s"></span>
            </article>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ───────────── Schedule (cards are built by js/schedule.js) ───────────── -->
  <section class="section-y peer-[.open]:border-t peer-[.open]:border-line" id="schedule">
    <div class="wrap">
      <h2 class="max-w-[16ch] text-h2 font-light tracking-title" data-i18n="schedH"></h2>
      <p class="mt-6 max-w-[56ch] text-lede text-muted" data-i18n="schedLede"></p>

      <div class="mt-10 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-x-7 gap-y-3 border-t border-line py-6 max-md:grid-cols-[auto_minmax(0,1fr)]">
        <div class="text-count font-light tracking-stats tabular-nums"><span id="count">0</span><small class="ml-0.5 text-[.42em] tracking-[-.01em] text-muted">/29</small></div>
        <div>
          <p class="mb-2.5 min-h-[1.4em] text-[17px] leading-[1.4] max-md:flex max-md:min-h-[2.8em] max-md:items-end" id="msg" aria-live="polite"></p>
          <div class="h-0.5 overflow-hidden rounded-[2px] bg-line"><i class="block h-full w-0 bg-fg transition-[width] duration-500 motion-reduce:transition-none" id="bar"></i></div>
        </div>
        <button class="py-1.5 text-[14px] text-muted underline underline-offset-3 hover:text-fg disabled:cursor-default disabled:no-underline disabled:opacity-40 max-md:col-span-full max-md:justify-self-start [&.armed]:text-fg"
                id="reset" type="button" disabled></button>
      </div>

      <!-- Day carousel: 1 card on phones, 3 on tablet/desktop. Swipe, or use the arrows. -->
      <div class="mt-4 flex items-center justify-between gap-4">
        <p class="text-[14px] text-muted tabular-nums" id="carousel-pos" aria-live="polite"></p>
        <div class="flex gap-2">
          <button class="grid size-10 place-items-center rounded-full border border-line-strong text-fg transition-[border-color,opacity] duration-200 hover:border-fg disabled:cursor-default disabled:opacity-35 disabled:hover:border-line-strong" id="carousel-prev" type="button">
            <svg class="size-[18px] fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="grid size-10 place-items-center rounded-full border border-line-strong text-fg transition-[border-color,opacity] duration-200 hover:border-fg disabled:cursor-default disabled:opacity-35 disabled:hover:border-line-strong" id="carousel-next" type="button">
            <svg class="size-[18px] fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <!-- pt-5 leaves room for the "don't skip" bubble; px-1/-mx-1 for the flash outline -->
      <div class="relative -mx-1 flex snap-x snap-mandatory scroll-px-1 gap-3 overflow-x-auto overscroll-x-contain px-1 pt-5 pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
           id="grid" role="region" aria-roledescription="carousel" tabindex="-1"></div>
      <p class="mt-6 text-[14px] text-muted" data-i18n="note"></p>
    </div>
  </section>

  <!-- ───────────── Excuses ───────────── -->
  <section class="section-y border-t border-line" id="excuses">
    <div class="wrap">
      <h2 class="max-w-[16ch] text-h2 font-light tracking-title" data-i18n="excH"></h2>
      <div class="mt-[clamp(40px,6vw,72px)] border-t border-line">
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e1q"></q><p class="font-serif text-answer italic" data-i18n="e1a"></p></div>
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e2q"></q><p class="font-serif text-answer italic" data-i18n="e2a"></p></div>
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e3q"></q><p class="font-serif text-answer italic" data-i18n="e3a"></p></div>
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e4q"></q><p class="font-serif text-answer italic" data-i18n="e4a"></p></div>
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e5q"></q><p class="font-serif text-answer italic" data-i18n="e5a"></p></div>
        <div class="grid grid-cols-2 items-baseline gap-x-[clamp(24px,5vw,80px)] gap-y-2 border-b border-line py-[30px] max-lg:grid-cols-1"><q class="text-quote tracking-snug text-muted" data-i18n="e6q"></q><p class="font-serif text-answer italic" data-i18n="e6a"></p></div>
      </div>
    </div>
  </section>

  <!-- ───────────── Closing ───────────── -->
  <section class="border-t border-line py-[clamp(96px,14vw,184px)] text-center" id="start">
    <div class="wrap">
      <svg class="mx-auto mb-8 block size-14" viewBox="0 0 40 40" aria-hidden="true"><circle class="fill-moon-lit" cx="20" cy="20" r="18"/></svg>
      <h2 class="mx-auto text-final font-light tracking-display" data-i18n="finalH"></h2>
      <p class="mx-auto mt-6 mb-10 max-w-[56ch] text-lede text-muted" data-i18n="finalLede"></p>
      <div class="flex flex-wrap justify-center gap-3">
        <a class="btn btn-primary" href="#schedule" data-jump="1" data-i18n="finalCta"></a>
        <button class="btn btn-ghost [&.copied]:border-fg" id="share" type="button">
          <svg class="mr-2 size-[18px] flex-none fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
          <span id="share-label" data-i18n="shareCta"></span>
        </button>
      </div>
      <p class="sr-only" id="share-live" aria-live="polite"></p>
      <p class="mt-[18px] text-[14px] text-muted" data-i18n="finalMicro"></p>
    </div>
  </section>

  <!-- ───────────── Support (Saweria) ───────────── -->
  <section class="border-t border-line py-[clamp(80px,11vw,140px)]" id="support">
    <div class="wrap grid grid-cols-[minmax(0,1fr)_minmax(0,300px)] items-center gap-[clamp(32px,6vw,96px)] max-lg:grid-cols-1">
      <div>
        <h2 class="max-w-[16ch] text-h2 font-light tracking-title" data-i18n="supportH"></h2>
        <p class="mt-6 mb-8 max-w-[56ch] text-lede text-muted" data-i18n="supportP"></p>
        <a class="btn btn-primary" id="saweria-link" target="_blank" rel="noopener" data-i18n="supportCta"></a>
        <p class="mt-4 text-[14px] text-muted" data-i18n="supportNote"></p>
      </div>
      <div class="qr-card grid aspect-square w-[min(300px,100%)] max-w-full place-items-center justify-self-end rounded-3xl border border-line-strong bg-qr p-3.5 max-lg:justify-self-center">
        <div id="saweria-qr" role="img" aria-label="QR code Saweria"></div>
      </div>
    </div>
  </section>
</main>

<!-- ───────────── Footer ───────────── -->
<footer class="border-t border-line pt-10 pb-[calc(40px+env(safe-area-inset-bottom,0px))] text-[14px] text-muted">
  <div class="wrap flex flex-wrap items-center justify-between gap-x-10 gap-y-4">
    <a class="inline-flex items-center gap-2.5 text-[18px] font-medium tracking-snug text-fg" href="#top">
      <svg class="size-5" viewBox="0 0 40 40" aria-hidden="true"><circle class="fill-moon-dark stroke-line-strong" cx="20" cy="20" r="18"/><path class="fill-moon-lit" d="M20 2A18 18 0 0 1 20 38A9.6 18 0 0 0 20 2Z"/></svg>
