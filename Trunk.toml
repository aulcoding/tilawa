# Build: `trunk build --release` → dist/ (what GitHub Pages serves, see .github/workflows/pages.yml)
# Dev:   `trunk serve` → http://localhost:5500, rebuilds + reloads on every save
[build]
target = "index.html"
dist = "dist"

[watch]
# Generated by the Tailwind hook below; watching it would rebuild forever
ignore = ["styles/build.css", "dist", "target", "node_modules"]

[serve]
port = 5500
# All interfaces, so a phone on the same Wi-Fi can open http://<laptop-ip>:5500
addresses = ["0.0.0.0"]

# Tailwind v4 compiles styles/app.css → styles/build.css before every build
[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["--no-install", "@tailwindcss/cli", "-i", "styles/app.css", "-o", "styles/build.css", "--minify"]
