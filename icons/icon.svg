<!-- Tilawa app icon: the site's moon logo on black. The moon stays inside the centre 80%,
     so Android can crop it to a circle/squircle ("maskable") without cutting it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256 256) scale(8) translate(-20 -20)">
    <circle cx="20" cy="20" r="18" fill="#0E1013" stroke="#2A2E34" stroke-width="0.6"/>
    <path d="M20 2A18 18 0 0 1 20 38A9.6 18 0 0 0 20 2Z" fill="#F3F5F7"/>
  </g>
</svg>
